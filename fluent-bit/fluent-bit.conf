# ================= PENGATURAN UMUM =================
[SERVICE]
    Flush        1                 # kirim log tiap 1 detik (jangan ditahan lama)
    Log_Level    info              # tingkat log Fluent Bit sendiri
    Parsers_File parsers.conf      # file berisi definisi cara mem-parse (JSON)

# ================= INPUT: dari mana log masuk =================
# Terima log dari Docker (logging driver: fluentd) di port 24224
[INPUT]
    Name   forward                 # tipe input "forward" (protokol fluentd)
    Listen 0.0.0.0                 # dengarkan dari semua alamat
    Port   24224                   # port tempat aplikasi mengirim log

# ================= FILTER: olah/ubah log =================
# Isi log dari aplikasi berupa teks JSON yang "terbungkus" di field "log".
# Filter ini membongkarnya jadi field terpisah: level, service, message, ts
[FILTER]
    Name         parser
    Match        *                 # berlaku untuk semua log yang masuk
    Key_Name     log               # field yang isinya mau dibongkar
    Parser       json              # bongkar pakai parser JSON (lihat parsers.conf)
    Reserve_Data On                # tetap simpan field asli lain (mis. container_name)

# ================= OUTPUT: ke mana log dikirim =================
# Kirim ke Elasticsearch, disimpan dalam index bernama "app-logs"
[OUTPUT]
    Name               es          # tujuan: Elasticsearch
    Match              *           # kirim semua log
    Host               host.docker.internal   # alamat Elasticsearch (di host)
    Port               9200        # port Elasticsearch
    Index              app-logs    # nama index penyimpanan log
    Suppress_Type_Name On          # wajib untuk Elasticsearch versi 8/9
    Logstash_Format    Off         # pakai 1 index tetap (bukan index per-tanggal)
    Retry_Limit        False       # coba terus kirim ulang kalau ES sempat down
