services:
  # Database tempat menyimpan user & data obat
  postgres:
    image: postgres:16-alpine
    container_name: apotek-db
    environment:                        # kredensial & nama database
      - POSTGRES_DB=apotek
      - POSTGRES_USER=apotek_user
      - POSTGRES_PASSWORD=apotek_pass
    volumes:
      - pgdata:/var/lib/postgresql/data # simpan data agar tidak hilang saat restart
    networks:
      - apotek

  # Pengumpul log: terima log dari aplikasi, kirim ke Elasticsearch
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    volumes:                            # pasang file konfigurasi dari folder lokal
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    ports:
      - "24224:24224"                   # port tempat menerima log
    extra_hosts:
      - "host.docker.internal:host-gateway"  # agar bisa akses Elasticsearch di host

  # Aplikasi apotek (Flask)
  app:
    build: ./app                        # build dari Dockerfile di folder ./app
    container_name: apotek-app
    environment:                        # pengaturan aplikasi & koneksi ke database
      - SERVICE_NAME=apotek-app
      - SECRET_KEY=rahasia-lab-elk
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=apotek
      - DB_USER=${DB_USER:-apotek_user}        # bisa dioverride; dipakai utk uji error
      - DB_PASSWORD=${DB_PASSWORD:-apotek_pass}
    ports:
      - "8080:8080"                     # buka aplikasi di http://IP-SERVER:8080
    depends_on:                         # tunggu postgres & fluent-bit jalan dulu
      - postgres
      - fluent-bit
    logging:
      driver: fluentd                   # arahkan log aplikasi ke Fluent Bit
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"           # jangan blokir app kalau Fluent Bit belum siap
        tag: apotek-app
    networks:
      - apotek

volumes:
  pgdata:                               # tempat penyimpanan data database

networks:
  apotek:                               # jaringan privat agar container saling terhubung
    driver: bridge
